# The same commands a contributor is asked to run (AGENTS.md), on every pull request and every push
# to main. Nothing else: no deploys, no badges, no coverage reports.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # so a release workflow can run the same checks before publishing

jobs:
  check:
    strategy:
      matrix:
        # The engines floor, which the tests depend on for type stripping, and the current LTS.
        node: ["22.18", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: every wiki page's `synced:` names a commit, and lint fails on one
          # a shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci # runs `prepare`, so the build is checked too
      - run: npm run typecheck
      - run: npm test
      # This repository's own wiki. A plain run fails only on lint errors, a broken wiki: staleness
      # and coverage are debt, so code not ingested yet does not turn the build red.
      - run: node src/bin/wikipoke.ts check
      - run: npm pack --dry-run # what would be published
